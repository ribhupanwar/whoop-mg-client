name: ios

on:
  workflow_dispatch:
  push:
    branches: [main, ui/dsta-dashboard-polish]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

# Rapid pushes to main each spawn an ~8-min macOS job (billed 10x on a private
# repo). Cancel the superseded run so only the newest commit builds an IPA.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-ipa:
    # Native Liquid Glass requires the iOS 26 SDK (Xcode 26+).
    runs-on: macos-15
    # Normal compute is ~8 min; cap a hung simulator/test so it cannot burn
    # hours of 10x-billed macOS minutes (the default is 360).
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 for native Liquid Glass
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Verify Swift SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Normalize bundled Proxima Nova face metadata for iOS
        run: |
          set -euo pipefail
          # Repair only the two licensed font copies with missing naming records.
          # Source glyphs and outlines remain untouched; the original repo files
          # are not rewritten or redistributed outside the app build.
          python3 -m venv "$RUNNER_TEMP/strap-font-venv"
          "$RUNNER_TEMP/strap-font-venv/bin/python" -m pip install --quiet fonttools
          "$RUNNER_TEMP/strap-font-venv/bin/python" - <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path

          for filename, style, postscript in (
              ("proxima-nova-medium.ttf", "Medium", "ProximaNova-Medium"),
              ("proxima-nova-semibold.ttf", "Semibold", "ProximaNova-Semibold"),
          ):
              path = Path("ios/Strap/Fonts") / filename
              font = TTFont(path)
              names = font["name"]
              for name_id, value in (
                  (1, "Proxima Nova"), (2, style),
                  (4, "Proxima Nova " + style), (6, postscript),
                  (16, "Proxima Nova"), (17, style),
              ):
                  names.setName(value, name_id, 3, 1, 0x409)
                  names.setName(value, name_id, 1, 0, 0)
              font.save(path)
              check = TTFont(path)
              assert check["name"].getDebugName(6) == postscript
              print("Validated iOS font naming:", filename, postscript)
          PY

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -uo pipefail
          xcodebuild -project ios/Strap.xcodeproj -scheme Strap \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug -derivedDataPath build \
            STRAP_BUILD_REVISION="$GITHUB_SHA" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Unit tests on a concrete iPhone simulator
        run: |
          set -uo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for k in sorted(d, reverse=True) for v in d[k] if v.get("isAvailable") and v["name"].startswith("iPhone")))')
          echo "Using simulator $UDID"
          xcodebuild -project ios/Strap.xcodeproj -scheme Strap \
            -destination "platform=iOS Simulator,id=$UDID" \
            -configuration Debug -derivedDataPath build \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            STRAP_BUILD_REVISION="$GITHUB_SHA" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}

      - name: Independently validate recorded-route GPX and FIT exports
        run: |
          set -euo pipefail
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/TestResults.xcresult" --output-path "$RUNNER_TEMP/route-attachments"
          python3 -m venv "$RUNNER_TEMP/route-validator"
          "$RUNNER_TEMP/route-validator/bin/pip" --no-cache-dir install --quiet fitdecode==0.11.0
          "$RUNNER_TEMP/route-validator/bin/python" tools/validate_route_exports.py "$RUNNER_TEMP/route-attachments"

      - name: Archive and package SideStore-ready ad-hoc signed IPA
        run: |
          set -uo pipefail
          xcodebuild archive -project ios/Strap.xcodeproj -scheme Strap \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Strap.xcarchive" \
            STRAP_BUILD_REVISION="$GITHUB_SHA" CODE_SIGNING_ALLOWED=NO 2>&1 | tee archive.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$RUNNER_TEMP/Strap.xcarchive/Products/Applications/Strap.app" "$RUNNER_TEMP/ipa/Payload/Strap.app"
          # An entirely unsigned bundle has no signed entitlements for a
          # sideloading signer to preserve. Ad-hoc sign with the declared
          # HealthKit capability so SideStore can inspect and re-sign it.
          # This is NOT an Apple provisioning signature and still needs
          # authorized re-signing on the user's device.
          APP="$RUNNER_TEMP/ipa/Payload/Strap.app"
          /usr/bin/codesign --force --deep --sign - \
            --entitlements ios/Strap/Strap.entitlements \
            --generate-entitlement-der "$APP"
          /usr/bin/codesign --verify --deep --strict "$APP"
          /usr/bin/codesign -d --entitlements :- "$APP" 2>&1 | tee "$RUNNER_TEMP/ipa/Strap-embedded-entitlements.txt"
          # PlistBuddy cannot reliably read /dev/stdin on GitHub macOS runners.
          # Extract the embedded entitlement into a regular file before checking.
          /usr/bin/codesign -d --entitlements :- "$APP" 2>/dev/null > "$RUNNER_TEMP/ipa/Strap-embedded-entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" "$RUNNER_TEMP/ipa/Strap-embedded-entitlements.plist" | grep -qx true
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry Strap-unsigned.ipa Payload
          shasum -a 256 Strap-unsigned.ipa

      - name: Verify licensed fonts are bundled in IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ipa/Payload/Strap.app"
          for font in ProximaNova-Regular ProximaNova-Bold ProximaNova-Light ProximaNova-RegularIt ProximaNova-BoldIt ProximaNova-LightIt proxima-nova-medium proxima-nova-semibold DINPro-Regular DINPro-Light DINPro-Bold; do
            if ! find "$APP" -type f -name "$font.ttf" -print -quit | grep -q .; then
              echo "::error::Missing bundled font: $font.ttf"
              exit 1
            fi
          done
          echo "All eleven licensed fonts are present in the IPA payload"

      - name: Verify packaged HealthKit entitlement
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ipa/Payload/Strap.app"
          ENTITLEMENTS="$APP/archived-expanded-entitlements.xcent"
          echo "Checking ad-hoc signed IPA entitlement payload"
          if [ ! -f "$ENTITLEMENTS" ]; then
            echo "::warning::No archived entitlement payload in unsigned app. SideStore must preserve and authorize HealthKit during final signing."
          else
            /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" "$ENTITLEMENTS" || {
              echo "::warning::Packaged app does not declare HealthKit in archived entitlements."
            }
          fi
          echo "Configured source entitlement:"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" ios/Strap/Strap.entitlements
          echo "Xcode target entitlement build setting:"
          xcodebuild -project ios/Strap.xcodeproj -scheme Strap -configuration Release -showBuildSettings 2>/dev/null | grep -m 1 'CODE_SIGN_ENTITLEMENTS ='

      - name: Package HealthKit signing entitlement for SideStore
        run: |
          set -euo pipefail
          # The ad-hoc signed IPA declares HealthKit but still requires authorized final signing.
          # Export this plist for the external signer; the final signed app
          # must include the same entitlement and an authorized profile.
          cp ios/Strap/Strap.entitlements "$RUNNER_TEMP/ipa/Strap-signing-entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" "$RUNNER_TEMP/ipa/Strap-signing-entitlements.plist"
          echo "IMPORTANT: Apply this entitlement while signing, not after installation."
          echo "Verify signed app: codesign -d --entitlements :- Payload/Strap.app"

      - name: Upload signing entitlement plist
        uses: actions/upload-artifact@v4
        with:
          name: Strap-HealthKit-signing-entitlements
          path: ${{ runner.temp }}/ipa/Strap-signing-entitlements.plist

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Strap-unsigned-ipa
          path: ${{ runner.temp }}/ipa/Strap-unsigned.ipa

      # Native screenshots are intentionally excluded from the IPA delivery job.
      # Simulator boot, repeated app launches, and screenshots previously consumed
      # the remaining job budget and caused the entire build to be cancelled.
      # Run UI screenshot capture in a separate workflow, not on the IPA critical path.

      # Job logs need repository auth; annotations are public. Re-emit the
      # first compiler errors so a failed public build is diagnosable.
      - name: Summarize compiler errors
        if: failure()
        run: |
          for log in build.log test.log archive.log; do
            if [ -f "$log" ]; then
              grep -E "\.swift:[0-9]+:[0-9]+: (error|warning):" "$log" | head -30 | while IFS= read -r line; do
                echo "::error::$line"
              done || true
            fi
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build.log
            test.log
            archive.log
          if-no-files-found: ignore

      - name: Upload test results bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14