name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR so a burst of pushes does not
# fan out into stale 6-job matrices.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The protocol tests need no Bluetooth radio and no third-party packages,
      # so they run on any CI runner. BLE behaviour is validated locally instead.
      - run: python -m unittest discover -s tests -t . -v