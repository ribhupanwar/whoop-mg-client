# XcodeGen spec for Strap — an original, clean-room UI client.
# Run `xcodegen generate` from this directory (ios/). All paths below are
# relative to this spec file, so `Strap` == ios/Strap in the repo.
name: Strap
options:
  bundleIdPrefix: com.ribhupanwar
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    # XcodeGen writes an explicit Info.plist (info: below), so Xcode must not
    # also auto-generate one — that produces a "multiple commands" conflict.
    GENERATE_INFOPLIST_FILE: "NO"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  Strap:
    type: application
    platform: iOS
    dependencies:
      - package: ZIPFoundation
    sources:
      - path: Strap
        excludes:
          - "Info.plist"
    info:
      # XcodeGen writes this plist at generation time. The BLE usage string
      # and background-central mode are what BandLink needs to keep reading.
      path: Strap/Info.plist
      properties:
        CFBundleDisplayName: Strap
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIAppFonts:
          - DINPro-Bold.ttf
          - DINPro-Light.ttf
          - DINPro-Regular.ttf
          - ProximaNova-Bold.ttf
          - ProximaNova-BoldIt.ttf
          - ProximaNova-Light.ttf
          - ProximaNova-LightIt.ttf
          - ProximaNova-Regular.ttf
          - ProximaNova-RegularIt.ttf
          - proxima-nova-medium.ttf
          - proxima-nova-semibold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: "Strap reads your own band's biometric stream locally."
        NSHealthShareUsageDescription: "Strap can read Apple Health activity, heart rate, sleep and fitness data to compare with band measurements. Reading is optional."
        NSHealthUpdateUsageDescription: "Optional: saves measured workouts and, when supported and validated, band-derived heart rate, steps, sleep and fitness metrics to Apple Health."
        UIBackgroundModes:
          - bluetooth-central
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ribhupanwar.strap
        # HealthKit is a capability, so the target needs the entitlement file.
        # CI builds with signing disabled; the signing profile used to install
        # the IPA must grant HealthKit or the toggle reports a clear failure.
        CODE_SIGN_ENTITLEMENTS: Strap/Strap.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
        # Custom icon in Strap/Assets.xcassets; no vendor artwork.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  StrapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StrapTests
    dependencies:
      - target: Strap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ribhupanwar.strap.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Strap.app/Strap"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Strap:
    build:
      targets:
        Strap: all
        StrapTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StrapTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release